name: Recover RetroRoom V6.25.2 FAST SCAN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-v6252-fast-scan-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V6.25.1 base
        run: |
          set -euo pipefail
          echo '974e240b8f5516bf8b1ecc56bc15a8f27e6ae1e8f419368e013e0d31b7c9446c  index.html' | sha256sum -c -

      - name: Extract intact patch from failed workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/hotfix-v6252-fast-scan.yml').read_text(encoding='utf-8').splitlines()
          out=[];inside=False
          for line in src:
              if "cat > /tmp/v6252.patch <<'PATCH'" in line:
                  inside=True
                  continue
              if inside and line.strip()=='PATCH':
                  break
              if inside:
                  out.append(line[10:] if line.startswith('          ') else line)
          if not out or out[0] != '--- a/index.html':
              raise SystemExit('Patch extraction failed')
          Path('/tmp/v6252.patch').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('Extracted patch lines:',len(out))
          PY
          git apply --check /tmp/v6252.patch
          git apply /tmp/v6252.patch

      - name: Verify exact FAST SCAN build
        run: |
          set -euo pipefail
          echo 'bb83df21ac690a80ebbb3d15813d456b606a8d02ae698450aae2672d72ec9f72  index.html' | sha256sum -c -
          test "$(wc -c < index.html)" -eq 516178
          grep -q 'fast-scan-v6252-script' index.html
          grep -q "retroom-fast-folder-scan" index.html
          grep -q 'Promise.all(cues.map' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
              p=Path(f'/tmp/rr-{i}.js');p.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True,stdout=subprocess.DEVNULL)
          print('Inline JS syntax OK:',len(scripts))
          PY

      - name: Update release metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('RetroRoom V6.25 CLEAN','RetroRoom V6.25.2 FAST SCAN').replace('État de V6.25 CLEAN','État de V6.25.2 FAST SCAN')
          needle='- D-pad numérique 8 directions généralisé ;\n'
          if needle in s and 'scan du dossier optimisé' not in s:
              s=s.replace(needle,needle+'- scan du dossier optimisé : un seul snapshot, médias ignorés immédiatement, CUE 3DO lus en parallèle ;\n')
          p.write_text(s,encoding='utf-8')
          Path('RELEASE_SHA256.txt').write_text('RetroRoom V6.25.2 FAST SCAN\nSHA256 bb83df21ac690a80ebbb3d15813d456b606a8d02ae698450aae2672d72ec9f72\nSIZE 516178 bytes\n',encoding='utf-8')
          PY

      - name: Commit release and clean temporary workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-v6252-fast-scan.yml .github/workflows/hotfix-v6252-fast-scan-recover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: accelerate RetroRoom folder scan'
          git push
