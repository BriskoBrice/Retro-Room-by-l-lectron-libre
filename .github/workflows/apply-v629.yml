name: Apply RetroRoom V6.29 release

on:
  push:
    branches: [main]
    paths:
      - 'release/v629-trigger'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f release/v629-trigger
          test -f release/patch_v629.py
          test -f release/release-v629.test.cjs
          test -f release/v629-payload.part-1
          test -f release/v629-payload.part-2

      - name: Apply V6.29 stable release
        shell: bash
        run: |
          set -euo pipefail
          cat release/v629-payload.part-* > /tmp/v629-payload.b64
          python release/patch_v629.py /tmp/v629-payload.b64 index.html
          echo '9e97ffdc8201e04a1bcc65aa0ec0139299eac84a0e80ee66e93eb455c5caa5e0  index.html' | sha256sum -c -
          rm -f tests/release-v6275.test.cjs
          cp release/release-v629.test.cjs tests/release-v629.test.cjs

      - name: Run regression tests
        run: npm test

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S|re.I):
              tag=html[m.start():html.find('>',m.start())+1]
              if re.search(r'\bsrc\s*=',tag,re.I):
                  continue
              code=m.group(1)
              if code.strip(): blocks.append(code)
          with tempfile.TemporaryDirectory() as td:
              for i,code in enumerate(blocks):
                  p=Path(td)/f'inline-{i}.js'
                  p.write_text(code,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print(f'INLINE_JS_OK={len(blocks)}')
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r release
          git add index.html README.md docs/SYSTEMS.md RELEASE_SHA256.txt tests/release-v629.test.cjs
          git add -u tests/release-v6275.test.cjs
          git commit -m 'release: RetroRoom V6.29 STABLE'
          git push
