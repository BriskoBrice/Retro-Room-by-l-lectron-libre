name: Hotfix RetroRoom V6.25.1 Library default

on:
  push:
    paths:
      - '.github/workflows/hotfix-v6251-library-default-all.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Retro Library default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('index.html')
          data = p.read_bytes()
          old_hash = hashlib.sha256(data).hexdigest()
          expected_old = '09a0c728f73abeb8bef93178051f64488a506fba72f1f817dd8d9191c2322d07'
          if old_hash != expected_old:
              raise SystemExit(f'Unexpected index.html baseline: {old_hash}')

          s = data.decode('utf-8')
          replacements = [
              ("<title>Retro Room V6.25 CLEAN — L’électron libre</title>",
               "<title>Retro Room V6.25.1 CLEAN — L’électron libre</title>"),
              ("let state={tab:prefs.tab||'all',query:'',sort:prefs.sort||'az',page:1};",
               "/* V6.25.1 — toujours ouvrir la bibliothèque sur TOUS. */\n  let state={tab:'all',query:'',sort:prefs.sort||'az',page:1};"),
              ("rows=libraryFiles.map(entryFromFile);state.page=1;state.query='';search.value='';",
               "rows=libraryFiles.map(entryFromFile);state.tab='all';state.page=1;state.query='';search.value='';"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old[:70]!r}; got {s.count(old)}')
              s = s.replace(old, new, 1)

          obsolete = "    if(state.tab!=='all'&&state.tab!=='favorites'&&state.tab!=='recent'&&!rows.some(e=>e.systemId===state.tab))state.tab='all';\n"
          if s.count(obsolete) != 1:
              raise SystemExit(f'Expected one obsolete scan fallback, got {s.count(obsolete)}')
          s = s.replace(obsolete, '', 1)

          p.write_text(s, encoding='utf-8')
          new_hash = hashlib.sha256(p.read_bytes()).hexdigest()
          expected_new = '974e240b8f5516bf8b1ecc56bc15a8f27e6ae1e8f419368e013e0d31b7c9446c'
          if new_hash != expected_new:
              raise SystemExit(f'Unexpected patched hash: {new_hash}')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('V6.25 CLEAN', 'V6.25.1 CLEAN')
          anchor = '- bibliothèque et sélection BIOS séparées ;\n'
          extra = '- la bibliothèque s’ouvre désormais toujours sur **TOUS** après chargement ou rescan ;\n'
          if extra not in r:
              if anchor not in r:
                  raise SystemExit('README insertion anchor missing')
              r = r.replace(anchor, anchor + extra, 1)
          readme.write_text(r, encoding='utf-8')

          Path('RELEASE_SHA256.txt').write_text(
              'RetroRoom V6.25.1 CLEAN\n'
              f'SHA256 {new_hash}\n'
              f'SIZE {p.stat().st_size} bytes\n',
              encoding='utf-8'
          )

          test = r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync(path.join(__dirname, '..', 'index.html'), 'utf8');

          test('Retro Library starts on TOUS instead of restoring the previous system tab', () => {
            assert.match(html, /let state=\{tab:'all',query:'',sort:prefs\.sort\|\|'az',page:1\};/);
            assert.doesNotMatch(html, /let state=\{tab:prefs\.tab\|\|'all'/);
          });

          test('rescanning a ROM folder returns the library to TOUS', () => {
            const scan = html.match(/async function scanPlus\(files\)\{[\s\S]*?savePrefs\(\);renderPlus\(\);\n  \}/)?.[0] || '';
            assert.match(scan, /rows=libraryFiles\.map\(entryFromFile\);state\.tab='all';state\.page=1;/);
          });
          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          Path('tests/library-default-all.test.cjs').write_text(test, encoding='utf-8')
          PY

      - name: Verify hotfix
        shell: bash
        run: |
          node --test tests/library-default-all.test.cjs
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if len(scripts) != 17:
              raise SystemExit(f'Expected 17 inline scripts, got {len(scripts)}')
          with tempfile.TemporaryDirectory() as d:
              for i, code in enumerate(scripts):
                  f = Path(d) / f'{i:02d}.js'
                  f.write_text(code, encoding='utf-8')
                  subprocess.run(['node', '--check', str(f)], check=True)
          print('17 inline scripts: syntax OK')
          PY
          grep -F "let state={tab:'all',query:'',sort:prefs.sort||'az',page:1};" index.html
          grep -F "rows=libraryFiles.map(entryFromFile);state.tab='all';state.page=1;state.query='';search.value='';" index.html
          sha256sum index.html

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-v6251-library-default-all.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: open Retro Library on all systems by default'
          git push
