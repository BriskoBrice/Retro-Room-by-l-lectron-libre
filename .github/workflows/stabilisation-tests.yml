name: RetroRoom stabilisation checks

on:
  push:
    branches:
      - retro-room-stabilisation-work
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
