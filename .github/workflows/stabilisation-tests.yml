name: RetroRoom stabilisation checks

on:
  push:
    branches:
      - retro-room-stabilisation-work
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Frozen source hashes
        run: sha256sum src/core-config.js src/arcade-compat.js src/emu-launch.js src/emu-overlay.js src/emu-lowres.js src/controls-layout.js src/controls-input.js src/controls-init.js
