name: Apply RetroRoom V6.27.5 release

on:
  push:
    branches: [main]
    paths:
      - 'release/v6275-trigger'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f release/v6275-trigger
          test -f release/README_V6275.md
          test -f release/release-v6275.test.cjs
          ls release/v6275-index.patch.part-* >/dev/null
          echo 'a12673201644966c56dfbb2e5ff9513656a7cc1bd79f9033580b4db65e5cf11e  index.html' | sha256sum -c -

      - name: Apply V6.27.5 index patch
        shell: bash
        run: |
          set -euo pipefail
          cat release/v6275-index.patch.part-* > /tmp/v6275-index.patch
          git apply --check /tmp/v6275-index.patch
          git apply /tmp/v6275-index.patch
          echo 'b297bea7ce295f545d1b40161fd87776dd0829b3c38ac4002876e53e8c2e5540  index.html' | sha256sum -c -

      - name: Install release docs and tests
        shell: bash
        run: |
          set -euo pipefail
          cp release/README_V6275.md README.md
          cp release/release-v6275.test.cjs tests/release-v6275.test.cjs
          printf '%s  index.html\n' 'b297bea7ce295f545d1b40161fd87776dd0829b3c38ac4002876e53e8c2e5540' > RELEASE_SHA256.txt

      - name: Run tests
        run: npm test

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r release
          git add index.html README.md RELEASE_SHA256.txt tests/release-v6275.test.cjs
          git commit -m 'release: RetroRoom V6.27.5'
          git push
