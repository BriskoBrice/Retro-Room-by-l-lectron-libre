name: Publish RetroRoom V6.25.3 CLEAN EXIT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v6253-clean-exit.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V6.25.2 base
        run: |
          set -euo pipefail
          echo 'bb83df21ac690a80ebbb3d15813d456b606a8d02ae698450aae2672d72ec9f72  index.html' | sha256sum -c -

      - name: Apply CLEAN EXIT patch
        run: |
          set -euo pipefail
          cat > /tmp/v6253.patch.b64 <<'B64'
          
          B64
          sed -i 's/^          //' /tmp/v6253.patch.b64
          base64 -d /tmp/v6253.patch.b64 > /tmp/v6253.patch
          git apply /tmp/v6253.patch

      - name: Verify exact CLEAN EXIT build
        run: |
          set -euo pipefail
          echo '5aa7d811742ed1a286275a383658f41200a8c35b28a624b501f00490e684cb0c  index.html' | sha256sum -c -
          test "$(wc -c < index.html)" -eq 524315
          grep -q 'Retro Room V6.25.3 CLEAN EXIT' index.html
          grep -q 'clean-exit-v6253-script' index.html
          grep -q 'fast-scan-v6252-script' index.html
          grep -q '__RETROOM_V625_3DO_CORE__' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          count=0
          for m in re.finditer(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I):
              tag=text[m.start():text.find('>',m.start())+1]
              if ' src=' in tag.lower():
                  continue
              count += 1
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(m.group(1)); name=f.name
              subprocess.run(['node','--check',name],check=True)
          print(f'inline scripts checked: {count}')
          PY

      - name: Update release metadata
        run: |
          set -euo pipefail
          cat > RELEASE_SHA256.txt <<'EOF'
          RetroRoom V6.25.3 CLEAN EXIT
          SHA256 5aa7d811742ed1a286275a383658f41200a8c35b28a624b501f00490e684cb0c
          SIZE 524315 bytes
          EOF
          sed -i 's/^          //' RELEASE_SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('**RetroRoom V6.25.1 CLEAN** est la version publique actuelle', '**RetroRoom V6.25.3 CLEAN EXIT** est la version publique actuelle')
          s=s.replace('## État de V6.25.1 CLEAN', '## État de V6.25.3 CLEAN EXIT')
          needle='- scan du dossier optimisé : un seul snapshot, médias ignorés immédiatement, CUE 3DO lus en parallèle ;\n'
          add='- sortie propre de l’émulateur : **QUITTER → BIBLIO → autre ROM**, sans recharger la page ni rescanner le dossier ;\n'
          if add not in s:
              s=s.replace(needle, needle+add)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit release and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v6253-clean-exit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: cleanly exit emulator and keep library loaded'
          git push
