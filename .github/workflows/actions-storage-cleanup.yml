name: Actions storage cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clean old Actions storage
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const liveArtifacts = artifacts.filter((a) => !a.expired).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            let deletedArtifacts = 0;
            for (const artifact of liveArtifacts.slice(1)) {
              try { await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id }); deletedArtifacts++; }
              catch (error) { core.warning(`Artifact ${artifact.id}: ${error.message}`); }
            }
            let caches = [];
            for (let page = 1; page <= 10; page++) {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', { owner, repo, per_page: 100, page });
              const pageCaches = response.data.actions_caches || [];
              caches.push(...pageCaches);
              if (pageCaches.length < 100) break;
            }
            let deletedCaches = 0;
            for (const cache of caches) {
              try { await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', { owner, repo, cache_id: cache.id }); deletedCaches++; }
              catch (error) { core.warning(`Cache ${cache.id}: ${error.message}`); }
            }
            core.notice(`Cleanup complete: ${deletedArtifacts} artifact(s) deleted, ${deletedCaches} cache(s) deleted. Newest artifact kept.`);
